# Example parameter file.  Use it with:
#     python run.py --config params.ini <subcommand> [args...]
#
# The values below are the defaults defined in config.py (the settings used
# in the paper), so running with this file gives the same results as running
# without --config.  Any key left out keeps its default value.

[solver]
time_limit  = 180000    # B&B wall-clock limit (seconds)
search_type = hybrid   # hybrid (best-first, switching to DFS on memory limit) or DFS
mem_limit   = 50       # memory usage (%) above which hybrid search switches to DFS
output      = false    # print B&B progress
fixing      = true     # variable fixing by reduced-cost tests

# Root node
[root]
max_iter  = 10000      # subgradient iterations
stepsize  = halving    # halving, exponential, sqrt or adaptive
s0        = 1e-1       # initial step size
target    = 1e-5       # final step size (halving / exponential)
alpha     = 0.99       # smoothing factor of the fractional solution used for branching
branch    = branch_2   # branching rule
cuts.add      = true   # separate triangle inequalities
cuts.max_tri  = 100000 # maximum number of inequalities of each type
cuts.max_tri2 = 100000
cuts.freq     = 199    # separation frequency (iterations)
cuts.max_iter = 10000  # last iteration at which separation is done
cuts.min_sep  = 500    # first iteration at which separation is done
cuts.max_add  = 1000   # inequalities added per separation round

# Child nodes
[child]
max_iter  = 300
stepsize  = halving
s0        = 1e-2
target    = 1e-4
alpha     = 0.95
branch    = branch_2
cuts.add      = false
cuts.max_tri  = 10000
cuts.max_tri2 = 10000
cuts.freq     = 101
cuts.max_iter = 3000
cuts.min_sep  = 99
cuts.max_add  = 100
